<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReadAlong</title>
<style>
  :root {
    --bg: #1b1e24; --panel: #23272f; --text: #d7dae0; --dim: #8a90a0;
    --accent: #6aa2ff; --active-bg: #2c3a55; --active-edge: #6aa2ff;
    --heading: #e8ebf2; --pending: #665534;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 19px/1.65 Georgia, "Times New Roman", serif;
  }
  #topbar {
    position: sticky; top: 0; z-index: 10; background: var(--panel);
    padding: 10px 16px; display: flex; gap: 14px; align-items: center;
    border-bottom: 1px solid #333a46;
    font: 14px/1.4 system-ui, Segoe UI, sans-serif;
  }
  #topbar button {
    background: var(--accent); color: #101318; border: 0; border-radius: 6px;
    padding: 6px 14px; font-weight: 600; cursor: pointer;
  }
  #topbar button:disabled { background: #3a4250; opacity: .5; }
  #doctitle { color: var(--dim); overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; max-width: 28ch; }
  #speedwrap { display: flex; align-items: center; gap: 6px; color: var(--dim); }
  #progresswrap { flex: 1; display: flex; align-items: center; gap: 8px; }
  #progressbar { flex: 1; height: 6px; background: #333a46; border-radius: 3px; }
  #progressfill { height: 100%; width: 0%; background: var(--accent);
                  border-radius: 3px; transition: width .5s; }
  #progresstext { color: var(--dim); min-width: 11ch; text-align: right; }
  #library { max-width: 760px; margin: 40px auto; padding: 0 20px;
             font-family: system-ui, Segoe UI, sans-serif; }
  #library button { display: block; width: 100%; text-align: left;
    background: var(--panel); color: var(--text); border: 1px solid #333a46;
    border-radius: 8px; padding: 14px 18px; margin: 10px 0; font-size: 16px;
    cursor: pointer; }
  #library button:hover { border-color: var(--accent); }
  #reader { max-width: 760px; margin: 0 auto; padding: 26px 20px 55vh; }
  .chunk { padding: 10px 14px; margin: 2px 0; border-radius: 8px;
           border-left: 3px solid transparent; cursor: pointer; }
  .chunk:hover { background: #232833; }
  .chunk.active { background: var(--active-bg);
                  border-left-color: var(--active-edge); }
  .chunk.heading { font-weight: 700; font-size: 1.25em; color: var(--heading);
                   margin-top: 1.1em; }
  .chunk.pending-audio { outline: 1px dashed var(--pending); }
  #toast { position: fixed; bottom: 18px; left: 50%;
    transform: translateX(-50%); background: var(--panel); color: var(--text);
    border: 1px solid #333a46; padding: 8px 16px; border-radius: 8px;
    font: 14px system-ui, sans-serif; opacity: 0; transition: opacity .3s; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="topbar">
  <button id="playpause" disabled>Play</button>
  <span id="doctitle">ReadAlong</span>
  <span id="speedwrap">
    <span>speed</span>
    <input id="speed" type="range" min="0.7" max="2.5" step="0.05" value="1">
    <span id="speedval">1.00x</span>
  </span>
  <span id="progresswrap">
    <div id="progressbar"><div id="progressfill"></div></div>
    <span id="progresstext"></span>
  </span>
</div>
<div id="library"></div>
<div id="reader"></div>
<div id="toast"></div>
<audio id="audio" preload="auto"></audio>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const audio = $("audio");
const state = { doc: null, chunks: [], idx: -1, playing: false, timer: null };

function toast(msg) {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("show"), 2500);
}

async function loadLibrary() {
  const r = await fetch("/api/library");
  const docs = (await r.json()).documents;
  const lib = $("library");
  lib.innerHTML = "<h2>Library</h2>";
  if (!docs.length) { lib.innerHTML += "<p>Drop a .docx into library\\</p>"; return; }
  for (const name of docs) {
    const b = document.createElement("button");
    b.textContent = name;
    b.onclick = () => openDoc(name);
    lib.appendChild(b);
  }
  if (docs.length === 1) openDoc(docs[0]);
}

async function openDoc(name) {
  const r = await fetch("/api/open", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: name }),
  });
  if (!r.ok) { toast("could not open " + name); return; }
  const body = await r.json();
  state.doc = body.doc;
  state.chunks = body.chunks;
  $("library").style.display = "none";
  $("doctitle").textContent = body.filename;
  renderChunks();
  $("playpause").disabled = false;
  pollProgress();
  const saved = parseInt(localStorage.getItem(posKey()) || "0", 10);
  setActive(Math.min(saved, state.chunks.length - 1), { scroll: true });
}

function posKey() { return "readalong:" + state.doc + ":pos"; }

function renderChunks() {
  const reader = $("reader");
  reader.innerHTML = "";
  state.chunks.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "chunk" + (c.is_heading ? " heading" : "");
    div.id = "chunk-" + i;
    div.textContent = c.text;
    div.onclick = () => { setActive(i, { scroll: false }); play(); };
    reader.appendChild(div);
  });
}

function setActive(i, opts) {
  if (state.idx >= 0) {
    const prev = $("chunk-" + state.idx);
    if (prev) prev.classList.remove("active");
  }
  state.idx = i;
  const el = $("chunk-" + i);
  if (el) {
    el.classList.add("active");
    el.scrollIntoView({ block: "center", behavior: (opts && opts.scroll) ? "auto" : "smooth" });
  }
  localStorage.setItem(posKey(), String(i));
}

async function play() {
  if (state.idx < 0 || state.idx >= state.chunks.length) return;
  const c = state.chunks[state.idx];
  const url = "/api/audio/" + state.doc + "/" + c.id;
  const head = await fetch(url, { method: "GET", headers: { Range: "bytes=0-1" } });
  const el = $("chunk-" + state.idx);
  if (head.status === 404) {
    if (el) el.classList.add("pending-audio");
    toast("audio still generating for this part - retrying...");
    state.playing = true;
    updatePlayButton();
    clearTimeout(state.retry);
    state.retry = setTimeout(play, 3000);
    return;
  }
  if (el) el.classList.remove("pending-audio");
  audio.src = url;
  audio.playbackRate = parseFloat($("speed").value);
  try { await audio.play(); state.playing = true; } catch (e) { state.playing = false; }
  updatePlayButton();
}

function pause() {
  audio.pause();
  clearTimeout(state.retry);
  state.playing = false;
  updatePlayButton();
}

function updatePlayButton() {
  $("playpause").textContent = state.playing ? "Pause" : "Play";
}

audio.addEventListener("ended", () => {
  if (state.idx + 1 < state.chunks.length) {
    setActive(state.idx + 1, { scroll: false });
    play();
  } else {
    state.playing = false;
    updatePlayButton();
    toast("end of document");
  }
});

$("playpause").onclick = () => {
  if (state.playing) pause();
  else { if (state.idx < 0) setActive(0, { scroll: true }); play(); }
};

$("speed").oninput = () => {
  const v = parseFloat($("speed").value);
  audio.playbackRate = v;
  $("speedval").textContent = v.toFixed(2) + "x";
  localStorage.setItem("readalong:speed", String(v));
};

async function pollProgress() {
  if (!state.doc) return;
  try {
    const r = await fetch("/api/progress/" + state.doc);
    const p = await r.json();
    const pct = p.total ? Math.round(100 * p.done / p.total) : 0;
    $("progressfill").style.width = pct + "%";
    $("progresstext").textContent =
      p.state === "complete" ? "all audio ready" : p.done + "/" + p.total + " ready";
    if (p.state !== "complete") setTimeout(pollProgress, 2000);
  } catch (e) { setTimeout(pollProgress, 5000); }
}

const savedSpeed = localStorage.getItem("readalong:speed");
if (savedSpeed) { $("speed").value = savedSpeed; $("speed").oninput(); }

document.addEventListener("keydown", (e) => {
  if (e.code === "Space" && e.target === document.body) {
    e.preventDefault();
    $("playpause").onclick();
  }
});

loadLibrary();
</script>
</body>
</html>
